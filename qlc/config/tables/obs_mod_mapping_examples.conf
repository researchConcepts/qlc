#
# Where:
#   DisplayName : label used in plot titles and file names
#   modVar      : IFS variable name (optionally with ,op,val for manual scaling)
#   obsVar      : native obs variable name (optionally with ,op,val)
#   targetUnit  : desired output unit — convert_units handles these automatically:
#                   kg/kg  → ug/m3, ppb, ppm     (mol-weight + air density)
#                   kg/m3  → ug/m3               (factor 1e9)
#                   Pa     → hPa                 (factor 0.01)
#                   J/m2   → kJ/m2               (factor 0.001)
#                 Use ",unitFAC" suffix (e.g. "ug/m3,1e9") or N/A only for
#                 non-standard conversions that convert_units cannot resolve.
#
# Variables with no IFS match are listed as comments under # NO_MATCH.
# Variables needing model-side unit conversion beyond a simple factor
# (e.g. kg/kg → ug/m3 via mol-weight) are flagged # REVIEW_UNITS.
#
# Station file convention:
#   ${QLC_HOME}/config/station_locations/<dataset_type>_stations-<filter>.csv
#   where filter = all | rural | urban | test
