# ============================================================================
# QLC AIFS WORKFLOW
# v1.0.2 — https://docs.researchconcepts.io/qlc/latest/user-guide/workflows/aifs
# Copyright (c) 2018-2026 ResearchConcepts io GmbH. All Rights Reserved.
# ============================================================================
# Chain: A1-MARS → B1-CONV → B2-PREP → C1-GLOB → D1-ANAL → E1-ECOL → E2-EVAL → Z1-XPDF
#
# Usage, e.g.:
#   qlc exp1 exp2 2025-11-01 2025-11-07 aifs -class=nl,rd -network=EU_AIRBASE,US_AIRNOW -scripts="D1-ANAL,Z1-XPDF"
#
#   qlc exp1 exp2 2025-11-01 2025-11-07 aifs
#   qlc exp1 exp2 2025-11-01 2025-11-07 aifs -scripts=D1-ANAL -region=Globe,US
#   qlc exp1 exp2 2025-11-01 2025-11-07 aifs -scripts=D1-ANAL -region=US -myvar="sfc_O3,210203"
#   qlc exp1 exp2 2025-11-01 2025-11-07 aifs -scripts=D1-ANAL,Z1-XPDF    -myvars="@AIFS_TESTS" -region=Globe,US,EU

# Use cases: https://docs.researchconcepts.io/qlc/latest/examples/use-cases/
# Validate:  qlc-vars validate ~/qlc/config/workflows/aifs/qlc_aifs.conf
# ============================================================================

#----------------------------------------------------------------------
# Source qlc.conf base configuration and common functions
#----------------------------------------------------------------------
[ -f "$HOME/qlc/config/qlc.conf" ] && source "$HOME/qlc/config/qlc.conf" || {
    echo "[$(date +"%Y-%m-%d %H:%M:%S")] [ERROR] Base config not found: $HOME/qlc/config/qlc.conf" >&2
    exit 1
}
#----------------------------------------------------------------------
# Run-time definitions - Control which scripts to execute
#----------------------------------------------------------------------
# Full workflow: MARS retrieval → Conversion → Global plots → Analysis → Evaluation → PDF
SUBSCRIPT_NAMES=("A1-MARS" "B1-CONV" "B2-PREP" "C1-GLOB" "D1-ANAL" "E1-ECOL" "E2-EVAL" "Z1-XPDF")

# Common subsets (comment out full workflow above, uncomment one below):
#SUBSCRIPT_NAMES=("A1-MARS" "B1-CONV" "B2-PREP" "C1-GLOB" "D1-ANAL" "Z1-XPDF")  # Without evaltools
#SUBSCRIPT_NAMES=("A1-MARS" "D1-ANAL" "Z1-XPDF")                                # Station analysis only
#SUBSCRIPT_NAMES=("D1-ANAL" "E1-ECOL" "E2-EVAL" "Z1-XPDF")                      # Analysis + evaltools (data required)

#----------------------------------------------------------------------
# Global MARS Retrievals
# Use @ prefix to reference a group defined in [VARIABLE_GROUPS] below
# Override at runtime: --myvar="O3|go3|O3|ug/m3;NO2|no2|NO2|ug/m3"
#----------------------------------------------------------------------

# Preset combinations (uncomment one):
#MARS_RETRIEVALS=("@AIFS_SFC" "@AIFS_PL")
#MARS_RETRIEVALS=("@AIFS_AQ" "@AIFS_AEROSOL" "@AIFS_GASES")
MARS_RETRIEVALS=("@AIFS_TESTS")

#----------------------------------------------------------------------
# Override global defaults from qlc.conf
#----------------------------------------------------------------------
PL_VRANGE="100,300,UTLS"         # For C1-GLOB: vertical range definitions
PFILL="shaded"                   # For C1-GLOB: fill or shaded
MODEL_RESOLUTION="O1280L137"     # For Z1-XPDF: model resolution label in report
PLOTEXTENSION="png"              # Plot format: png or pdf (higher quality)

#----------------------------------------------------------------------
# Difference plot configuration (C1-GLOB PyFerret plots)
#----------------------------------------------------------------------
# DIFF_MODE="percent"              # percent difference: 100*(exp1-expN)/expN
# DIFF_PALETTE="custom"            # color palette: "custom" (blue-white-red)
# DIFF_PERCENT_RANGE="50"          # symmetric range: ±50%
# DIFF_PERCENT_STEP="5"            # contour step: 5% intervals
# DIFF_WHITE_ZONE="5"              # neutral white band -5% to +5%

#----------------------------------------------------------------------
# D1-ANAL: Common settings (apply to all regions)
#----------------------------------------------------------------------
MODEL="AIFS-COMPO"               # Model type label
EXP_LABELS=""                    # Leave empty — set per-run via --exp_labels=
MODEL_LEVEL=""                   # Leave empty for automatic surface level detection
STATION_RADIUS_DEG=0.5           # Search radius (degrees) for model grid points
USE_UNIFORM_TIME_GRID=false      # Preserve actual obs timestamps
PLOT_TYPE="map,burden,zonal,meridional,scatter,taylor"  # Plot types to generate
TIME_AVERAGE="3hourly"           # AIFS NRT: 3-hourly is appropriate
UNIT_TO="ug/m3"                  # Global target unit
SPATIAL_INTERP_METHOD="nearest"  # nearest (default), linear, cubic
MULTIPROCESSING=false
N_THREADS=1
DEBUG=false
DEBUG_EXTENDED=false
SHOW_STATION_TIMESERIES_OBS=true
SHOW_STATION_TIMESERIES_MOD=true
SHOW_STATION_TIMESERIES_COM=true

#----------------------------------------------------------------------
USE_GRIB_SOURCE=true  # true:  Read GRIB files directly from ~/qlc/Results/<expN>
                      # false: Read netCDF files from        ~/qlc/Analysis/<expN>
#----------------------------------------------------------------------
# Station/plot settings
#----------------------------------------------------------------------
STATION_NETWORK=""
STATION_SUFFIX=""
STATION_TYPE="concentration"
SHOW_STATIONS=true
PLOT_MODE="grouped"
STATION_PLOT_GROUP_SIZE=5
SHOW_MIN_MAX=true
LOG_Y_AXIS=false
FIX_Y_AXIS=true
FORCE_FULL_YEAR=false
SHOW_STATION_MAP=true

SAVE_PLOT_FORMAT=$PLOTEXTENSION
SAVE_DATA_FORMAT="nc"
READ_DATA_FORMAT=$SAVE_DATA_FORMAT
LAZY_LOAD_NC=true

MAP_COLORMAP="turbo"
MAP_COLORMAP_DIFF="RdBu_r"
ENABLE_DIFF_PLOTS=false
USE_LOG_SCALE=false
USE_NORMALIZED_SCALE=false
MAP_SHOW_STATS=true
MAP_PROJECTION="Robinson"
PUBLICATION_STYLE=true
PLOT_DPI=""

TEX_FILE_MODE="per_region"
MULTI_REGION_MODE=true

#----------------------------------------------------------------------
# ACTIVE_REGIONS — region definitions are in ~/qlc/config/qlc.conf
# Override at runtime: -network=EU_AIRBASE,US_AIRNOW
#----------------------------------------------------------------------
# NRT-capable networks (data available within 24-48 h):

# Preset combinations (uncomment one):
#ACTIVE_REGIONS=("US_AIRNOW" "EU_AIRBASE")
ACTIVE_REGIONS=("US_AIRNOW")

#----------------------------------------------------------------------
# Stop bash sourcing here - Python INI sections follow
#----------------------------------------------------------------------
return 0

# ============================================================================
# Python INI Sections (parsed by VariableRegistry, not bash)
# ============================================================================

[VARIABLE_REGISTRY]

# Examples:
# 
# sfc_*: Surface Variables
# -------------------------
sfc_AOD550,210207,Total Aerosol Optical Depth at 550nm - [dimensionless]
sfc_PM2.5,210073,Particulate matter d <= 2.5 um - [kg m-3]
sfc_PM10,210074,Particulate matter d <= 10 um - [kg m-3]
sfc_NH4_as,249.210,Ammonium mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_SO4_as,11.210,Sulphate mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_NO3_as,247.210,Nitrate mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_NO3_cs,248.210,Nitrate mass mixing ratio - [kg kg-1] (coarse mode, IFS-AER)
sfc_HNO3,6.217,Nitric Acid mass mixing ratio - [kg kg-1]
sfc_NH3,19.217,Ammonia  mass mixing ratio - [kg kg-1]
sfc_NO2,210121,Nitrogen Dioxide mass mixing ratio - [kg kg-1]
sfc_SO2,210122,Sulphur Dioxide mass mixing ratio - [kg kg-1]
sfc_O3,210203,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
sfc_T2m,167,2 metre temperature - [K]

# Pressure Level Variables (pl_*)
# --------------------------------
pl_NH3,19.217,Ammonia  mass mixing ratio - [kg kg-1]
pl_HNO3,6.217,Nitric Acid mass mixing ratio - [kg kg-1]
pl_NO2,210121,Nitrogen Dioxide mass mixing ratio - [kg kg-1]
pl_SO2,210122,Sulphur Dioxide mass mixing ratio - [kg kg-1]
pl_O3,210203,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
pl_T,130,Temperature - [K]

#======================================================================

[VARIABLE_GROUPS]

# Surface-level: e.g., aerosols & gases & meteo
AIFS_SFC=sfc_AOD550;sfc_PM2.5;sfc_PM10;sfc_NH4_as;sfc_SO4_as;sfc_NO3_as;sfc_NO3_cs;sfc_HNO3;sfc_NH3;sfc_NO2;sfc_SO2;sfc_O3;sfc_T2m

# Pressure-level, e.g., trace gases & meteo
AIFS_PL=pl_NH3;pl_HNO3;pl_O3;pl_T

# Air quality
AIFS_AQ=sfc_AOD550;sfc_PM2.5;sfc_PM10

# Aerosol species
AIFS_AEROSOL=sfc_NH4_as;sfc_SO4;sfc_NO3_as;sfc_NO3_cs

# Gas phase chemistry
AIFS_GASES=sfc_HNO3;sfc_NH3;sfc_NO2;sfc_SO2;sfc_O3

# Quick tests
AIFS_TESTS=pl_O3

#======================================================================

[MARS_DEFAULTS]

CLASS=mc            # AIFS model class (mc); override per-exp: -class=mc,rd
TYPE=fc
STREAM=oper
GRID=0.25/0.25      # AIFS native resolution (0.25 degrees)
TIME=00
PL_LEVELIST=1000    # Surface only (1000 hPa); extend for pressure levels
STEP_SFC=0/to/21/by/3
STEP_PL=0/to/21/by/3
STEP_ML=0/to/21/by/3

#======================================================================
# END OF CONFIGURATION
#======================================================================
