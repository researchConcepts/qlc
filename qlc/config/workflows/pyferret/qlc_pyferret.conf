#----------------------------------------------------------------------
# Source qlc.conf base configuration and common functions
#----------------------------------------------------------------------
[ -f "$HOME/qlc/config/qlc.conf" ] && source "$HOME/qlc/config/qlc.conf" || {
    echo "[$(date +"%Y-%m-%d %H:%M:%S")] [ERROR] Base config not found: $HOME/qlc/config/qlc.conf" >&2
    exit 1
}

#----------------------------------------------------------------------
# Run-time definitions - Control which scripts to execute
#----------------------------------------------------------------------
# Workflow: MARS retrieval → Conversion → Global plots → PDF
SUBSCRIPT_NAMES=("A1-MARS" "B1-CONV" "B2-PREP" "C1-GLOB" "Z1-XPDF")

# Common subsets (comment out full workflow above, uncomment one below):
# Skip MARS + conversion when NetCDF data already exists:
#SUBSCRIPT_NAMES=("C1-GLOB" "Z1-XPDF")

#----------------------------------------------------------------------
# Global MARS Retrievals
# Use @ prefix to reference a group defined in [VARIABLE_GROUPS] below
# Override at runtime: --myvar="O3|go3|O3|ug/m3;NO2|no2|NO2|ug/m3"
#----------------------------------------------------------------------

# Preset combinations (uncomment one):
#MARS_RETRIEVALS=("@GLOB_SFC" "@GLOB_PL")
#MARS_RETRIEVALS=("@GLOB_AQ" "@GLOB_AEROSOL" "@GLOB_GASES")
#MARS_RETRIEVALS=("@GLOB_TEST1" "@GLOB_TEST2" "@GLOB_TEST3" "@GLOB_TEST4" "@GLOB_TEST5")
MARS_RETRIEVALS=("@GLOB_TEST5")

#----------------------------------------------------------------------
# Override global defaults from qlc.conf
#----------------------------------------------------------------------
PL_VRANGE="100,300,UTLS"           # For C1-GLOB: vertical range definitions
PFILL="shaded"                     # For C1-GLOB: fill or shaded
MODEL_RESOLUTION="T511L137"        # For Z1-XPDF: model resolution label in report
PLOTEXTENSION="png"                # Plot format: png or pdf (higher quality)

#----------------------------------------------------------------------
# Difference plot configuration (C1-GLOB PyFerret plots)
#----------------------------------------------------------------------
# DIFF_MODE="percent"              # percent difference: 100*(exp1-expN)/expN
# DIFF_PALETTE="custom"            # color palette: "custom" (blue-white-red)
# DIFF_PERCENT_RANGE="50"          # symmetric range: ±50%
# DIFF_PERCENT_STEP="5"            # contour step: 5% intervals
# DIFF_WHITE_ZONE="5"              # neutral white band -5% to +5%

TEX_FILE_MODE="per_region"

#----------------------------------------------------------------------
# Stop bash sourcing here - Python INI sections follow
#----------------------------------------------------------------------
return 0

# ============================================================================
# Python INI Sections (parsed by VariableRegistry, not bash)
# ============================================================================

[VARIABLE_REGISTRY]

# Examples:
# 
# sfc_*: Surface Variables
# -------------------------
sfc_AOD550,210207,Total Aerosol Optical Depth at 550nm - [dimensionless]
sfc_PM2.5,210073,Particulate matter d <= 2.5 um - [kg m-3]
sfc_PM10,210074,Particulate matter d <= 10 um - [kg m-3]
sfc_NH4_as,249.210,Ammonium mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_SO4_as,11.210,Sulphate mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_NO3_as,247.210,Nitrate mass mixing ratio - [kg kg-1] (fine mode, IFS-AER)
sfc_NO3_cs,248.210,Nitrate mass mixing ratio - [kg kg-1] (coarse mode, IFS-AER)
sfc_HNO3,6.217,Nitric Acid mass mixing ratio - [kg kg-1]
sfc_NH3,19.217,Ammonia  mass mixing ratio - [kg kg-1]
sfc_NO2,210121,Nitrogen Dioxide mass mixing ratio - [kg kg-1]
sfc_SO2,210122,Sulphur Dioxide mass mixing ratio - [kg kg-1]
sfc_O3,210203,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
sfc_T2m,167,2 metre temperature - [K]

# Pressure Level Variables (pl_*)
# --------------------------------
pl_NH3,19.217,Ammonia  mass mixing ratio - [kg kg-1]
pl_HNO3,6.217,Nitric Acid mass mixing ratio - [kg kg-1]
pl_O3,210203,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
pl_T,130,Temperature - [K]
pl_PSC,210016,PSC (experimental) - [-]

#======================================================================

[VARIABLE_GROUPS]

# Surface-level: e.g., aerosols & gases & meteo
GLOB_SFC=sfc_AOD550;sfc_PM2.5;sfc_PM10;sfc_NH4_as;sfc_SO4_as;sfc_NO3_as;sfc_NO3_cs;sfc_HNO3;sfc_NH3;sfc_NO2;sfc_SO2;sfc_O3;sfc_T2m

# Pressure-level, e.g., trace gases & meteo
GLOB_PL=pl_NH3;pl_HNO3;pl_O3;pl_T

# Air quality
GLOB_AQ=sfc_AOD550;sfc_PM2.5;sfc_PM10

# Aerosol species
GLOB_AEROSOL=sfc_NH4_as;sfc_SO4_as;sfc_NO3_as;sfc_NO3_cs

# Gas phase chemistry
GLOB_GASES=sfc_HNO3;sfc_NH3;sfc_NO2;sfc_SO2;sfc_O3

# Polar Stratospheric Cloud
GLOB_STRAT=pl_PSC

# Quick tests
GLOB_TEST1=sfc_NH4_as;sfc_NO3_as;sfc_NO3_cs;SO4_as
GLOB_TEST2=sfc_PM2.5
GLOB_TEST3=sfc_AOD550
GLOB_TEST4=sfc_T2m
GLOB_TEST5=pl_NH3

#======================================================================

[MARS_DEFAULTS]

CLASS=rd            # Model class (rd=default); override with -class=nl,nl or -class=mc,mc
TYPE=fc
STREAM=oper
GRID=0.50/0.50      # Grid resolution (0.50 degrees)
TIME=00
PL_LEVELIST=1/5/10/25/50/75/100/150/200/300/500/600/700/850/925/1000
STEP_SFC=12/24
STEP_PL=12

#======================================================================
# END OF CONFIGURATION
#======================================================================
