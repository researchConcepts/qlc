# sfc_Wind10m,207,10 metre wind speed - [m s-1]

# Reactive Gases (IFS-name syntax preferred; GRIB dot-notation also accepted)
# sfc_O3,go3,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
# sfc_O3,203.210,Ozone mass mixing ratio - full chemistry scheme - [kg kg-1]
