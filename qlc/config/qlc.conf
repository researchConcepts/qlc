# sfc_NO2,210121,Nitrogen Dioxide mass mixing ratio - [kg kg-1]
# sfc_SO2,so2,Sulphur Dioxide mass mixing ratio - [kg kg-1]
# sfc_SO2,122.210,Sulphur Dioxide mass mixing ratio - [kg kg-1]
# sfc_SO2,210122,Sulphur Dioxide mass mixing ratio - [kg kg-1]
# sfc_HNO3,hno3,Nitric Acid mass mixing ratio - [kg kg-1]
# sfc_HNO3,6.217,Nitric Acid mass mixing ratio - [kg kg-1]
# sfc_HNO3,217006,Nitric Acid mass mixing ratio - [kg kg-1]
# sfc_NH3,nh3,Ammonia mass mixing ratio - [kg kg-1]
# sfc_NH3,19.217,Ammonia  mass mixing ratio - [kg kg-1]
# sfc_NH3,217019,Ammonia  mass mixing ratio - [kg kg-1]


# Aerosol bulk mass / optical depth : pm1 (210072), pm2p5 (210073), pm10 (210074) in kg/m3 — use targetUNIT=ug/m3 (auto-converts)
# sfc_PM1,pm1,Particulate matter d <= 1 um - [kg m-3]
