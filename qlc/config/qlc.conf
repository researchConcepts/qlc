# Description:
#   QLC uses a hierarchical configuration system with global defaults, workflow-specific settings, 
#   and command-line overrides. This main configuration file defines paths, default parameters, 
#   and system-wide settings. All workflow configurations inherit these settings and can 
#   override them as needed.
#
# New in v1.0.2:
#   - 28 observation networks (added Brazil INMET, AQ, SP; now centrally defined here)
#   - AERONET AOD mapping: od550aero → aod550 for AERONET_L15 and AERONET_L20
#   - REGION_* blocks consolidated: no per-workflow repetition needed
#   - VARIABLE_GROUPS aligned with CAMS/EAC5 evaluation framework (all commented-out)
#   - Full changelog: https://docs.researchconcepts.io/qlc/latest/reference/changelog
#
# Copyright (c) 2018-2026 ResearchConcepts io GmbH. All Rights Reserved.
# Questions/Comments: qlc Team @ ResearchConcepts io GmbH <qlc@researchconcepts.io>
# ============================================================================
#----------------------------------------------------------------------
#----------------------- QLC version to be used -----------------------
QLC_VERSION="VERSION"
#----------------------------------------------------------------------
#----------------------- Path definitions -----------------------------
#----------------------------------------------------------------------
# Use QLCHOME if already set by runtime detection, otherwise default to $HOME/qlc
# This allows automatic switching between PyPI and dev installations
QLC_HOME="${QLCHOME:-$HOME/qlc}"
DATA_PATH="${QLC_HOME}/data"
SCRIPTS_PATH="${QLC_HOME}/bin"
WORKING_DIRECTORY="${QLC_HOME}"
MARS_RETRIEVAL_DIRECTORY="${QLC_HOME}/Results"
ANALYSIS_DIRECTORY="${QLC_HOME}/Analysis"
PLOTS_DIRECTORY="${QLC_HOME}/Plots"
TEX_DIRECTORY="${QLC_HOME}/Presentations"
#----------------------------------------------------------------------
#----------------------- PDF presentation and info  -------------------
#----------------------------------------------------------------------
TEAM_PREFIX="CAMS" # without underscore
EVALUATION_PREFIX="EVAL"
MODEL_RESOLUTION="T511L137"
TIME_RESOLUTION="03hh"
CONFIG_DIR="${QLC_HOME}/config"
PLOTEXTENSION="png"
#----------------------------------------------------------------------
# TeX layout: plots per page in C1-GLOB reports (1, 2, 4, or 6)
TEX_PLOTS_PER_PAGE=6
#TEX_PLOTS_PER_PAGE=1
#----------------------------------------------------------------------
# Difference plot configuration (for PyFerret C1-GLOB plots)
# DIFF_MODE: "absolute" (exp1-expN) or "percent" (100*(exp1-expN)/expN)
# DIFF_PALETTE: "custom" (blue-white-red), "no_green_centered", "rainbow"
# DIFF_PERCENT_RANGE/STEP: symmetric range and contour interval for % diffs
# DIFF_WHITE_ZONE: white zone around zero (% of range) — "custom" palette only
# See: https://docs.researchconcepts.io/qlc/latest/reference/qlc-conf
DIFF_MODE="percent"
DIFF_PALETTE="custom"
DIFF_PERCENT_RANGE="50"
DIFF_PERCENT_STEP="5"
DIFF_WHITE_ZONE="5"
#----------------------------------------------------------------------
#----------------------- VERTICAL RANGE DEFINITIONS -------------------
#----------------------------------------------------------------------
# PL_VRANGE / ML_VRANGE — subset to PLOT/ANALYZE after retrieval
# PL_LEVELIST / ML_LEVELIST (in [MARS_DEFAULTS]) — what to RETRIEVE
# Format: "min,max,name"  (hPa for PL, layer index for ML)
# See: https://docs.researchconcepts.io/qlc/latest/reference/qlc-conf
#----------------------------------------------------------------------
PL_VRANGE="100,300,UTLS"   # Default: UTLS (100-300 hPa, ~9-16 km)
ML_VRANGE="35,55,UTLS"     # Default: UTLS in model-level indices

# Alternative ranges (uncomment to override):
# PL_VRANGE="300,1000,TROP"     ; ML_VRANGE="55,137,TROP"    # Troposphere
# PL_VRANGE="1,100,STRAT"       ; ML_VRANGE="1,35,STRAT"     # Stratosphere
# PL_VRANGE="700,1000,LOWTROP"  ; ML_VRANGE="100,137,LOWTROP" # Lower Troposphere
#----------------------- DEFAULT SETTINGS -----------------------------
# All can be overridden by workflow configs or CLI flags.
# See: https://docs.researchconcepts.io/qlc/latest/reference/qlc-conf
#----------------------------------------------------------------------
REGION="${REGION:-Globe}"                   # Default plot region
OBS_PATH="${OBS_PATH:-$HOME/qlc/obs/data}"  # Obs data root (subdir auto-extracted from type prefix)
OBS_DATASET_VERSION="${OBS_DATASET_VERSION:-latest}"
STATION_RADIUS_DEG="${STATION_RADIUS_DEG:-0.5}"      # Grid-point search radius (degrees)
DEFAULT_OBS_PATH="${DEFAULT_OBS_PATH:-${QLC_HOME}/obs/data}"
DEFAULT_OBS_DATASET_VERSION="${DEFAULT_OBS_DATASET_VERSION:-latest}"
DEFAULT_STATION_RADIUS_DEG="${DEFAULT_STATION_RADIUS_DEG:-0.5}"
SPATIAL_INTERP_METHOD="${SPATIAL_INTERP_METHOD:-nearest}"    # nearest | linear | cubic
TEMPORAL_INTERP_METHOD="${TEMPORAL_INTERP_METHOD:-}"         # empty = none | linear | nearest
MODEL_LEVEL="${MODEL_LEVEL:-}"                               # empty = all levels
STATION_TYPE="${STATION_TYPE:-concentration}"                # concentration | deposition | both
SAVE_PLOT_FORMAT="${SAVE_PLOT_FORMAT:-pdf}"      # pdf | png | svg | jpg (comma-sep for multiple)
SAVE_DATA_FORMAT="${SAVE_DATA_FORMAT:-nc}"       # nc | csv
READ_DATA_FORMAT="${READ_DATA_FORMAT:-nc}"       # nc | csv
ENABLE_DIFF_PLOTS="${ENABLE_DIFF_PLOTS:-true}"
USE_LOG_SCALE="${USE_LOG_SCALE:-true}"
USE_NORMALIZED_SCALE="${USE_NORMALIZED_SCALE:-true}"
MAP_SHOW_STATS="${MAP_SHOW_STATS:-true}"
MAP_PROJECTION="${MAP_PROJECTION:-Robinson}"     # Robinson | PlateCarree | Mollweide | EqualEarth
PUBLICATION_STYLE="${PUBLICATION_STYLE:-true}"
MULTIPROCESSING="${MULTIPROCESSING:-false}"
N_THREADS="${N_THREADS:-1}"                      # >1 only reliable on Linux
DEBUG="${DEBUG:-false}"
DEBUG_EXTENDED="${DEBUG_EXTENDED:-false}"


