#----------------------------------------------------------------------
#----------------------- VARIABLE GROUPS ------------------------------
# Named lists referenced as @GROUP_NAME in MARS_RETRIEVALS.
# Usage: --myvar="@EAC5_SFC"  or  MARS_RETRIEVALS=("@EAC5_SFC" "@EAC5_PL")
# Reference: ~/qlc/config/tables/obs_mod_mapping_examples.conf
# See: https://docs.researchconcepts.io/qlc/latest/reference/qlc-conf
#----------------------------------------------------------------------

[VARIABLE_GROUPS]

# Workflow-specific (define in workflow configs, not here):

# AEROSOL_SFC=sfc_NH4_as;sfc_NO3_as;sfc_SO4_as;sfc_PM2.5;sfc_PM10;sfc_AOD550
# GAS_SFC=sfc_O3;sfc_HNO3;sfc_NO2;sfc_SO2;sfc_NH3
# METEO_SFC=sfc_T2m;sfc_RH2m;sfc_Pres

#----------------------------------------------------------------------
#----------------------- MARS RETRIEVAL DEFAULTS ----------------------
# Override priority: Command Line > Workflow Config > Global Defaults
# CLI overrides: -class= -grid= -step= -time= -levelist= --myvar=
# See: https://docs.researchconcepts.io/qlc/latest/reference/qlc-conf
#----------------------------------------------------------------------

[MARS_DEFAULTS]

CLASS=rd              # rd (research), od (operations), ea (ERA), nl (KNMI), mc (AIFS NRT)
TYPE=fc               # fc (forecast), an (analysis), cf (control forecast)
STREAM=oper           # oper, enfo (ensemble), da, wave
GRID=0.5/0.5          # Grid resolution: 0.25/0.25, 0.50/0.50, 1.0/1.0
TIME=00:00:00         # Forecast base time: 00, 06, 12, 18 UTC

# Forecast steps (hours from base time)
STEP_SFC=0/to/21/by/3    # 3-hourly surface fields
STEP_PL=0/to/21/by/3     # 3-hourly pressure-level fields
STEP_ML=0/to/21/by/3     # 3-hourly model-level fields
# Alternative: STEP_SFC=12/24  (12 h and 24 h only — smaller download)

# Pressure levels to retrieve for _pl variables (hPa, top→surface)
PL_LEVELIST=10/50/100/150/200/400/700/850/925/1000
# Full standard list: 1/5/10/20/30/50/70/100/150/200/250/300/400/500/600/700/800/850/900/925/950/1000

# Model levels for _ml variables (IFS L137: 1=top, 137=surface)
ML_LEVELIST=1/to/137
# UTLS only: ML_LEVELIST=35/to/55

# Advanced parameters (the Python parser forwards ANY key added here to MARS):
# AREA=90/-180/-90/180   # Spatial subset N/W/S/E
# RESOL=AV               # Native spectral resolution
# NUMBER=0/to/50         # Ensemble members
# ACCURACY=24            # Packing accuracy (bits)

#----------------------------------------------------------------------
# END OF MARS DEFAULTS
#----------------------------------------------------------------------

