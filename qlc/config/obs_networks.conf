# QLC Observation Networks Configuration
# Format: network_key|data_path|version_dir|metadata_source|description
#
# This file defines ALL available observation networks for consistent
# processing across variable extraction, station generation, and metadata tools.
#
# Fields:
#   network_key: Unique identifier used in scripts and configs
#   data_path: Path relative to $HOME/qlc/obs/data/ (use $HOME for absolute paths)
#   version_dir: Version subdirectory or "latest" (empty for no version subdir)
#   metadata_source: Source for station metadata (ghost, csv, netcdf, aqs)
#   description: Human-readable description
#
# Metadata sources:
#   ghost: Extract from GHOST NetCDF global attributes
#   csv: Parse from native CSV metadata files in network directory
#   netcdf: Extract coordinates from NetCDF data files
#   aqs: Use EPA AQS master site database (aqs_site-info.csv)
#   eea: Use EEA master site database (eea_site-info.csv)

# Ver0d NetCDF-based networks (QLC native format) - prefix: ver0d_
# Note: EBAS available in 3 versions - ver0d_ebas_daily, ver0d_ebas_hourly, plus ghost_ebas
# Ver0d EBAS networks share same metadata file (stations identical, only variables differ)
ver0d_ebas_daily|ver0d/ebas_daily|latest|ebas_shared|EBAS Daily Ver0d
ver0d_ebas_hourly|ver0d/ebas_hourly|latest|ebas_shared|EBAS Hourly Ver0d
# Note: airbase directory contains unified EEA airbase data
ver0d_airbase|ver0d/airbase|latest|eea|AirBase Ver0d
# Note: AirNow gets its own metadata from EPA AQS database
ver0d_airnow|ver0d/airnow|latest|airnow|AirNow Ver0d (EPA AQS stations)
# China networks don't have GHOST equivalents - extract from NetCDF
ver0d_china_aq|ver0d/china_aq|latest|china|China AQ Ver0d

# Brazil NetCDF networks - prefix: nc_
# These use brazil_data metadata source which reads from ~/qlc/obs/data/site-infos/brazil_data_site-info.csv
nc_brazil_inmet|nc/Brazil_INMET||brazil_data|Brazil Meteorological Stations (INMET)
nc_brazil_aq|nc/Brazil_AQ||brazil_data|Brazil State Air Quality Networks
nc_brazil_sp|nc/Brazil_SP||brazil_data|Brazil Sao Paulo Air Quality (CETESB)

# CSV-based networks with native metadata - prefix: csv_
# Note: CastNet also available as ghost_castnet (harmonized version)
csv_amon|csv/AMoN||csv|NADP Ammonia Monitoring Network (CSV)
csv_castnet|csv/CASTNet||csv|CastNet (CSV with native metadata)
csv_nndmn|csv/NNDMN||csv|NADP Mercury Deposition Network (CSV)

# GHOST networks - always use latest version dynamically
# Note: Several networks available in both Ver0d and GHOST versions (choose based on need):
#   - EBAS: ebas/ebas_daily/ebas_hourly (Ver0d) vs ghost_ebas (GHOST harmonized)
#   - AirNow: airnow (Ver0d) vs ghost_aqs (GHOST harmonized, same EPA AQS database)
#   - AirBase: airbase/airbase_ineris (Ver0d) vs ghost_airbase (GHOST harmonized)
#   - CastNet: castnet (CSV) vs ghost_castnet (GHOST harmonized)
# File naming: {network_key}_stations-{type}.csv ensures no conflicts
ghost_ebas|ghost/ebas|latest|ghost|GHOST EBAS (harmonized)
ghost_aqs|ghost/aqs|latest|aqs|GHOST AQS (harmonized EPA stations)
ghost_airbase|ghost/airbase|latest|eea|GHOST AirBase (harmonized)
ghost_castnet|ghost/castnet|latest|ghost|GHOST CastNet (harmonized)
ghost_naps|ghost/naps|latest|ghost|GHOST NAPS (harmonized)
ghost_uk_air|ghost/uk_air|latest|ghost|GHOST UK Air (harmonized)
ghost_aeronet_lev15|ghost/aeronet_lev15|latest|ghost|GHOST AERONET Level 1.5
ghost_aeronet_lev20|ghost/aeronet_lev20|latest|ghost|GHOST AERONET Level 2.0
ghost_indaaf|ghost/indaaf|latest|ghost|GHOST INDAAF (African aerosols)
ghost_nadp_airmon|ghost/nadp_airmon|latest|ghost|GHOST NADP AIRMoN (harmonized)
ghost_nadp_mdn|ghost/nadp_mdn|latest|ghost|GHOST NADP MDN (harmonized)
ghost_nadp_ntn|ghost/nadp_ntn|latest|ghost|GHOST NADP NTN (harmonized)
ghost_wmo_wdcpc|ghost/wmo_wdcpc|latest|ghost|GHOST WMO Precipitation Chemistry
ghost_harmonized|ghost/ghost_harmonized|latest|ghost|GHOST Harmonized (200+ variables)

